
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contato | Meu Portfólio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
        }

        header {
            background: #1e293b;
            padding: 20px 8%;
        }

        header a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
        }

        main {
            max-width: 700px;
            margin: 80px auto;
            padding: 20px;
        }

        h1 {
            color: #38bdf8;
            font-size: 35px;
            margin-bottom: 15px;
        }

        .descricao {
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        .contato-card {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }

        .contato-card h3 {
            color: #38bdf8;
            margin-bottom: 8px;
        }

        .contato-card a {
            color: #e2e8f0;
            text-decoration: none;
        }

        .contato-card a:hover {
            color: #38bdf8;
        }

        .voltar {
            display: inline-block;
            margin-top: 20px;
            background: #0284c7;
            color: white;
            padding: 12px 22px;
            border-radius: 8px;
            text-decoration: none;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <header>
        <a href="index.html">← Voltar ao início</a>
    </header>

    <main>

        <h1>Entre em contato</h1>

        <p class="descricao">
            Será um prazer conversar com você!
            Confira meus canais de contato abaixo.
        </p>

        <div class="contato-card">
            <h3>📧 E-mail</h3>
            <a href="mailto:seuemail@email.com">
                seuemail@email.com
            </a>
        </div>

        <div class="contato-card">
            <h3>💻 GitHub</h3>
            <a href="https://github.com/SEUUSUARIO" target="_blank">
                Meu perfil no GitHub
            </a>
        </div>

        <div class="contato-card">
            <h3>💼 LinkedIn</h3>
            <a href="https://www.linkedin.com/in/SEUUSUARIO/"
               target="_blank">
                Meu perfil no LinkedIn
            </a>
        </div>

        <a href="index.html" class="voltar">
            Voltar para página inicial
        </a>

    </main>

    <footer>
        <p>© 2026 - Meu Currículo</p>
    </footer>

</body>
</html>
